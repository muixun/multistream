<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multistreams</title>
    
    <link rel="stylesheet" href="static/css/multitwitch.css">
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/jquery-ui.min.js"></script>
    <script src="static/js/multitwitch.js"></script>
    
    <style>
        /* Chat-faner med nøytral mørkegrå farge på aktiv fane */
        #tablist { 
            display: flex; gap: 8px; list-style: none; padding: 0; margin: 0; margin-bottom: 10px; 
        }
        #tablist li { margin: 0; }
        #tablist a { 
            color: #fff; text-decoration: none; background: #2a2a2d; 
            padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; 
        }
        #tablist .ui-tabs-active a, #tablist a:hover { 
            background: #444 !important; /* Mørk, nøytral grå */
            color: #fff;
        }
        
        body { 
            margin: 0; padding: 0; background-color: #0b0b0c; color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        #helpbox {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 90%; max-width: 650px;
        }
        h1.title { font-size: 3.5em; font-weight: 700; margin-bottom: 5px; color: #fff; letter-spacing: -0.5px; }
        p.subtitle { font-size: 1.1em; color: #888; margin-bottom: 40px; }
        .commands-box { background: #151518; padding: 30px 40px; border-radius: 8px; border: 1px solid #2a2a2d; text-align: left; }
        .commands-title { font-size: 0.9em; font-weight: 600; margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid #2a2a2d; padding-bottom: 12px; color: #999; text-transform: uppercase; letter-spacing: 1px; }
        .cmd-item { display: flex; align-items: center; margin-bottom: 12px; font-size: 1.1em; color: #ccc; }
        .cmd-item:last-child { margin-bottom: 0; }
        .badge { padding: 4px 10px; border-radius: 4px; font-weight: 600; width: 90px; text-align: center; margin-right: 15px; color: #fff; font-size: 0.85em; }
        .code-block { background: #000; padding: 4px 8px; border-radius: 4px; color: #fff; font-family: monospace; border: 1px solid #333; }

        #stream_menu { 
            position: fixed; 
            top: 50%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 9999; 
            background: #000; 
            border: 2px solid #fff; 
            padding: 12px; 
            border-radius: 8px; 
            display: none; 
            flex-direction: column; 
            gap: 8px; 
            min-width: 160px;
        }
        #active_streams_list {
            display: flex; flex-direction: column; gap: 5px; margin-bottom: 5px;
        }
        .stream-checkbox-row {
            display: flex; align-items: center; gap: 8px; color: #fff;
            font-weight: bold; font-size: 14px; cursor: pointer;
        }
        #new_stream_inputs {
            display: flex; flex-direction: column; gap: 5px;
        }
        .stream-input {
            width: 100%; box-sizing: border-box;
            padding: 4px 6px; border-radius: 2px; border: 2px solid #333;
            background: #fff; color: #000; font-size: 14px; outline: none;
        }
        .stream-input:focus { border-color: #000; }
        
        .add-stream-text {
            text-align: center; font-size: 13px; font-weight: bold; color: #fff;
            margin-top: 2px; margin-bottom: 4px;
        }

        .modal-buttons { display: flex; justify-content: space-between; gap: 10px; }
        .modal-buttons button {
            flex: 1; padding: 4px 0; border: 1px solid #ccc; border-radius: 2px;
            cursor: pointer; font-weight: normal; font-size: 13px;
            background: #f0f0f0; color: #000;
        }
        .modal-buttons button:hover { background: #ddd; }
    </style>
</head>
<body>

<div id="helpbox">
    <h1 class="title">Multistreams</h1>
    <p class="subtitle">Watch multiple streams or videos simultaneously.</p>
    <div class="commands-box">
        <h3 class="commands-title">Commands</h3>
        <div class="cmd-item"><span class="badge" style="background: #9146FF;">Twitch</span> <span class="code-block">username</span></div>
        <div class="cmd-item"><span class="badge" style="background: #FF0000;">YouTube</span> <span class="code-block">yt:video-ID</span></div>
        <div class="cmd-item"><span class="badge" style="background: #53FC18; color:#000;">Kick</span> <span class="code-block">kick:username</span></div>
        <div class="cmd-item"><span class="badge" style="background: #85C742;">Rumble</span> <span class="code-block">rumble:video-ID</span></div>
        <div class="cmd-item"><span class="badge" style="background: #6441a5;">VODs</span> <span class="code-block">tvod:video-ID</span></div>
    </div>
</div>

<div id="wrapper" style="display: none;">
    <div id="streams"></div>
    <div id="chatbox">
        <ul id="tablist"></ul>
    </div>
</div>

<div id="stream_menu">
    <div id="active_streams_list"></div>
    
    <div id="new_stream_inputs">
        <input type="text" class="stream-input" placeholder="">
    </div>
    
    <div class="add-stream-text">Add Stream</div>
    <div class="modal-buttons">
        <button id="cancel-btn">Cancel</button>
        <button id="apply-btn">Ok</button>
    </div>
</div>

<div id="bottom_right" style="position: fixed; bottom: 10px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 4px;">
    <a href="#" id="open-streams-btn" style="color: #ccc; text-decoration: none;">Change Streams</a> |
    <a href="javascript:toggle_chat()" style="color: #ccc; text-decoration: none;">Toggle Chat</a>
</div>

<script>
    function getCurrentStreams() {
        // Dekoder URLen slik at eventuelle spesialtegn (%3A) blir til vanlige kolon igjen
        let rawHash = window.location.hash.replace('#', '');
        if (!rawHash) return [];
        return decodeURIComponent(rawHash).split('/').filter(s => s.trim() !== '');
    }

    function applyStreams() {
        let streams = [];
        
        const checkboxes = document.querySelectorAll('#active_streams_list input[type="checkbox"]:checked');
        checkboxes.forEach(cb => streams.push(cb.value));
        
        const inputs = document.querySelectorAll('#new_stream_inputs .stream-input');
        inputs.forEach(input => {
            const val = input.value.trim();
            if (val) streams.push(val);
        });
        
        let newHash = streams.length > 0 ? streams.join('/') : '';
        
        // Sjekker om adressen allerede er lik. Hvis ja, tving oppdatering uansett. 
        if (decodeURIComponent(window.location.hash.replace('#', '')) === newHash) {
            if (typeof load_streams_from_hash === 'function') {
                load_streams_from_hash();
            }
        } else {
            window.location.hash = newHash;
        }
        
        document.getElementById('stream_menu').style.display = 'none';
    }

    function setupInput(inputElement) {
        inputElement.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                
                const newBox = document.createElement('input');
                newBox.type = 'text';
                newBox.className = 'stream-input';
                newBox.placeholder = '';
                
                document.getElementById('new_stream_inputs').appendChild(newBox);
                setupInput(newBox); 
                newBox.focus(); 
            }
        });
    }

    setupInput(document.querySelector('.stream-input'));

    document.getElementById('open-streams-btn').addEventListener('click', function(e) {
        e.preventDefault();
        
        const listContainer = document.getElementById('active_streams_list');
        listContainer.innerHTML = ''; 
        
        const currentStreams = getCurrentStreams();
        
        currentStreams.forEach(stream => {
            const row = document.createElement('label');
            row.className = 'stream-checkbox-row';
            
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.value = stream;
            cb.checked = true; 
            
            const text = document.createTextNode(stream);
            
            row.appendChild(cb);
            row.appendChild(text);
            listContainer.appendChild(row);
        });

        const inputContainer = document.getElementById('new_stream_inputs');
        while(inputContainer.children.length > 1) {
            inputContainer.removeChild(inputContainer.lastChild);
        }
        inputContainer.children[0].value = '';

        document.getElementById('stream_menu').style.display = 'flex';
        setTimeout(() => inputContainer.children[0].focus(), 50);
    });

    document.getElementById('cancel-btn').addEventListener('click', function() {
        document.getElementById('stream_menu').style.display = 'none';
    });

    document.getElementById('apply-btn').addEventListener('click', applyStreams);
    
    // Logikk for å huske om chat er lukket eller åpen
    window.addEventListener('load', function() {
        if (sessionStorage.getItem('chatClosed') === 'true') {
            setTimeout(function() {
                if (typeof toggle_chat === "function") {
                    toggle_chat(); 
                }
            }, 500); 
        }
    });

    document.querySelector('a[href="javascript:toggle_chat()"]').addEventListener('click', function() {
        let isCurrentlyClosed = sessionStorage.getItem('chatClosed') === 'true';
        sessionStorage.setItem('chatClosed', !isCurrentlyClosed);
    });
</script>
</body>
</html>
